name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: campus_copies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov ruff black isort mypy bandit

    - name: Run Ruff (Linting)
      run: ruff check app/

    - name: Run Black (Formatting Check)
      run: black --check app/

    - name: Run isort (Import Sorting Check)
      run: isort --check-only app/

    - name: Run Bandit (Security Analysis)
      run: bandit -r app/

    - name: Run Tests
      env:
        JWT_SECRET: test_secret
        ADMIN_SETUP_KEY: test_admin_key
        DATABASE_URL: sqlite:///./test.db
        DATABASE_URL_DIRECT: sqlite:///./test.db
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: test_role_key
      run: |
        pytest --cov=app tests/

  build-docker:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      working-directory: ./backend
      run: |
        docker build -t campus-copies-backend:latest .
